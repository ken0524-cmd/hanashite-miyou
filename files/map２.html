<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ぼうけんマップ 🗺️</title>
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
<style>
:root {
  --yellow:#FFD93D; --orange:#FF6B6B; --green:#6BCB77;
  --blue:#4D96FF; --purple:#C77DFF; --pink:#FF9ECD; --dark:#3a3a5c;
}
*{margin:0;padding:0;box-sizing:border-box}
body {
  font-family:'Kosugi Maru',sans-serif;
  background:#1a3a6b;
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;
}

header {
  width:100%;max-width:540px;
  padding:.8rem 1rem .5rem;
  text-align:center;
  background:rgba(0,0,0,.35);
  border-bottom:3px solid rgba(255,255,255,.12);
  flex-shrink:0;
}
.title-row { display:flex;align-items:center;justify-content:center;gap:.2rem;margin-bottom:.35rem }
.tc {
  font-size:clamp(1.3rem,4.5vw,1.9rem);font-weight:900;
  display:inline-block;
  animation:tBounce 2s ease-in-out infinite;
  text-shadow:2px 2px 0 rgba(0,0,0,.4);
}
.tc:nth-child(1){color:#FF6B6B;animation-delay:0s}
.tc:nth-child(2){color:#FFD93D;animation-delay:.07s}
.tc:nth-child(3){color:#6BCB77;animation-delay:.14s}
.tc:nth-child(4){color:#4D96FF;animation-delay:.21s}
.tc:nth-child(5){color:#C77DFF;animation-delay:.28s}
.tc:nth-child(6){color:#FF9ECD;animation-delay:.35s}
.tc:nth-child(7){color:#FFD93D;animation-delay:.42s}
@keyframes tBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

.stats-row{display:flex;justify-content:center;gap:.4rem;flex-wrap:wrap}
.chip {
  background:rgba(255,255,255,.13);border:1.5px solid rgba(255,255,255,.22);
  border-radius:50px;padding:.22rem .7rem;
  font-size:.68rem;font-weight:700;color:rgba(255,255,255,.9);
}

.map-wrap {
  width:100%;max-width:540px;
  position:relative;
  flex:1;
  padding:.5rem .5rem 0;
}

.map-frame {
  border-radius:20px;
  overflow:hidden;
  box-shadow:
    0 0 0 4px rgba(255,255,255,.15),
    0 0 0 7px rgba(0,0,0,.3),
    0 16px 40px rgba(0,0,0,.5);
  position:relative;
  border:3px solid #8a6030;
}
.map-frame::before {
  content:'';
  position:absolute;inset:0;z-index:20;
  border-radius:17px;
  box-shadow:inset 0 0 30px rgba(0,0,0,.25),inset 0 0 8px rgba(0,0,0,.15);
  pointer-events:none;
}
.map-frame svg {
  display:block;width:100%;height:auto;
}

.bottom-panel {
  width:100%;max-width:540px;
  padding:.5rem .7rem .8rem;
  display:flex;flex-direction:column;gap:.4rem;
}

.prog-card {
  background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.12);
  border-radius:14px;padding:.5rem .8rem;
  display:flex;align-items:center;gap:.6rem;
}
.prog-label{font-size:.65rem;font-weight:700;color:rgba(255,255,255,.7);white-space:nowrap;min-width:52px}
.prog-bg{flex:1;height:12px;background:rgba(255,255,255,.1);border-radius:12px;overflow:hidden}
.prog-fill{
  height:100%;border-radius:12px;
  background:linear-gradient(90deg,#6BCB77,#4D96FF,#C77DFF);
  transition:width 1.4s cubic-bezier(.34,1.1,.64,1);
}
.prog-pct{font-size:.68rem;font-weight:900;color:white;min-width:28px;text-align:right}

.next-card {
  background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.1);
  border-radius:14px;padding:.45rem .8rem;
  display:flex;align-items:center;gap:.55rem;
}
.next-icon{font-size:1.3rem}
.next-text{flex:1}
.next-label{font-size:.6rem;color:rgba(255,255,255,.5);font-weight:700}
.next-val{font-size:.8rem;font-weight:900;color:white}
.next-bar-bg{height:6px;background:rgba(255,255,255,.1);border-radius:6px;margin-top:.2rem;overflow:hidden}
.next-bar-fill{height:100%;background:linear-gradient(90deg,#FF6B6B,#FFD93D);border-radius:6px;transition:width .8s ease}

.btn-row{display:flex;gap:.45rem}
.nbtn {
  flex:1;font-family:'Kosugi Maru',sans-serif;
  font-size:.78rem;font-weight:700;
  border:none;border-radius:50px;
  padding:.6rem .5rem;cursor:pointer;transition:all .15s;
}
.btn-p{
  background:linear-gradient(135deg,#ff7c7c,#e63000);color:white;
  box-shadow:0 4px 0 #8a1a00,0 6px 16px rgba(255,80,0,.3);
}
.btn-p:hover{transform:translateY(-2px)}
.btn-p:active{transform:translateY(2px);box-shadow:0 2px 0 #8a1a00}
.btn-k{
  background:rgba(255,255,255,.12);color:rgba(255,255,255,.85);
  border:2px solid rgba(255,255,255,.2);
  box-shadow:0 3px 0 rgba(0,0,0,.2);
}
.btn-k:hover{background:rgba(255,255,255,.2)}

.goal-banner {
  display:none;
  background:linear-gradient(135deg,#1a5a00,#3a9800);
  border:2px solid #6BCB77;
  border-radius:14px;padding:.7rem;text-align:center;
  box-shadow:0 0 20px rgba(100,200,80,.4);
}
.goal-banner.show{display:block}
.goal-banner .gt{font-size:1rem;font-weight:900;color:#c0ff90}
.goal-banner .gs{font-size:.7rem;color:rgba(180,255,140,.8)}

.popup {
  position:fixed;inset:0;z-index:100;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);backdrop-filter:blur(6px);
}
.popup.open{display:flex}
.popup-inner {
  background:#1e3a5a;
  border:3px solid rgba(255,255,255,.2);
  border-radius:24px;padding:1.4rem 1.5rem;
  max-width:260px;width:88%;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  animation:pIn .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.popup-emoji{font-size:2.8rem;display:block;margin-bottom:.4rem}
.popup-title{font-size:.95rem;font-weight:900;color:white;margin-bottom:.25rem}
.popup-sub{font-size:.72rem;color:rgba(255,255,255,.6);line-height:1.6;margin-bottom:.85rem}
.popup-close{
  font-family:'Kosugi Maru',sans-serif;
  background:linear-gradient(135deg,#4D96FF,#2a60e0);
  color:white;border:none;border-radius:50px;
  padding:.5rem 1.4rem;font-size:.82rem;font-weight:700;
  cursor:pointer;box-shadow:0 4px 0 #1a3a8a;transition:all .15s;
}
.popup-close:hover{transform:translateY(-2px)}

@keyframes chestShake{
  0%,100%{transform:translateX(0) rotate(0)}
  20%{transform:translateX(-6px) rotate(-3deg)}
  40%{transform:translateX(6px) rotate(3deg)}
  60%{transform:translateX(-5px) rotate(-2deg)}
  80%{transform:translateX(5px) rotate(2deg)}
}

.cf{position:fixed;inset:0;pointer-events:none;z-index:200;display:none}
.cp{position:absolute;animation:cpF linear forwards}
@keyframes cpF{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>

          <!-- 肉まん本体 -->
          <path d="M0,-36 C8,-36 20,-32 27,-24 C35,-14 38,-4 38,8 C38,22 24,34 0,34 C-24,34 -38,22 -38,8 C-38,-4 -35,-14 -27,-24 C-20,-32 -8,-36 0,-36 Z"
            fill="#fff5e0" stroke="#d4a060" stroke-width="2"/>
          <!-- 上部のひだ -->
          <g stroke="#c89040" stroke-width="1.8" fill="none" stroke-linecap="round">
            <path d="M-8,-30 C-6,-36 -2,-38 0,-38"/>
            <path d="M-4,-33 C-2,-37 0,-38 0,-38"/>
            <path d="M4,-33 C2,-37 0,-38 0,-38"/>
            <path d="M8,-30 C6,-36 2,-38 0,-38"/>

          <!-- ほっぺ -->
          <ellipse cx="-22" cy="10" rx="9" ry="5.5" fill="#FFB6C1" opacity=".55"/>

          <!-- 左目 -->

          <ellipse cx="11" cy="0" rx="9" ry="11" fill="white" stroke="#999" stroke-width="1.6"/>

          <ellipse cx="8" cy="1" rx="5" ry="6.5" fill="#5a3a1a"/>
          <!-- ハイライト -->
          <ellipse cx="-7" cy="-2" rx="2" ry="2.5" fill="white" opacity=".9"/>
          <ellipse cx="9" cy="-2" rx="2" ry="2.5" fill="white" opacity=".9"/>

          <path id="mMouth" d="M-8,18 Q0,25 8,18" stroke="#666" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- 地名ラベル -->
      <g transform="translate(200,62)">

        <text x="0" y="4" text-anchor="middle" font-family="'Kosugi Maru',sans-serif" font-size="10" fill="#90ee60" font-weight="bold">🌲 もり スタート！</text>

      <g transform="translate(388,215)">

      <g transform="translate(462,50)">

<div class="bottom-panel">
  <div class="goal-banner" id="goalBanner">
    <div class="gt">🏰 やったー！おしろにとうちゃく！！ 🎊</div>
    <div class="gs">25まいのマスをぜんぶせいかした！すごい！</div>
  </div>

  <div class="prog-card">
    <div class="prog-label" id="progLabel">スタート</div>

  </div>
</div>

<script>
const SK = "hanashite_records_v2";
const CPR = 5;
const TOTAL = 25;

// 25マスの座標（森→うみ→さばく→やま→おしろ、大きくぐねぐね）
const POS = [
  // もりエリア（1-5）左上→右へ
  {x:210,y:62},{x:242,y:68},{x:278,y:84},{x:316,y:102},{x:348,y:122},
  // うみのほとりエリア（6-10）右上カーブ
  {x:382,y:145},{x:418,y:172},{x:438,y:200},{x:440,y:230},{x:428,y:260},
  // さばくエリア（11-15）右中→折り返し
  {x:410,y:285},{x:390,y:308},{x:372,y:334},{x:360,y:362},{x:362,y:392},
  // やまエリア（16-20）左へ大きく折れる
  {x:370,y:420},{x:398,y:446},{x:418,y:472},{x:424,y:500},{x:408,y:528},
  // おしろエリア（21-25）左下へ
  {x:375,y:550},{x:336,y:566},{x:290,y:574},{x:244,y:580},{x:268,y:644},
];

// エリアとメッセージ（もり→うみ→さばく→やま→おしろ）
const INFO = [
  {e:"🌲",a:"もりのみち",m:"もりからぼうけんのはじまり！さあ、しゅっぱつ！"},
  {e:"🌿",a:"もりのみち",m:"みどりのしげみがいっぱい！きれいだね！"},
  {e:"🐿️",a:"もりのみち",m:"りすがとびはねてる！かわいい！"},
  {e:"🍄",a:"もりのみち",m:"きのこをみつけたよ！おもしろいね！"},
  {e:"🌱",a:"もりのみち",m:"もりをぬけた！つぎはうみだ！"},
  {e:"⛵",a:"うみのほとり",m:"うみがみえてきた！ふねがみえるよ！"},
  {e:"🦀",a:"うみのほとり",m:"かにがよこにはしってる！"},
  {e:"🐠",a:"うみのほとり",m:"いろんなさかながおよいでる！"},
  {e:"🐚",a:"うみのほとり",m:"きれいなかいがらだ！"},
  {e:"🌊",a:"うみのほとり",m:"なみがきれい！うみをぬけた！"},
  {e:"🌅",a:"さばくのみち",m:"さばくにとうちゃく！うつくしいゆうやけ！"},
  {e:"⭐",a:"さばくのみち",m:"よぞらにほしがかがやく！"},
  {e:"🐪",a:"さばくのみち",m:"らくだにのれるかな？"},
  {e:"🦎",a:"さばくのみち",m:"とかげがいわのうえにいる！"},
  {e:"🌵",a:"さばくのみち",m:"さばくをぬけた！つぎはやまだ！"},
  {e:"🗻",a:"やまのみち",m:"たかいやまにのぼるぞ！"},
  {e:"🌈",a:"やまのみち",m:"にじがかかったよ！きれい！"},
  {e:"🦅",a:"やまのみち",m:"わしがおおぞらをとんでる！"},
  {e:"🌸",a:"やまのみち",m:"さくらがさいてきれい！"},
  {e:"❄️",a:"やまのみち",m:"ゆきだ！やまをこえた！もうすぐおしろ！"},
  {e:"🎉",a:"おしろへ！",m:"おしろがみえてきた！もうすこし！"},
  {e:"🎊",a:"おしろへ！",m:"かみふぶきがとんでる！"},
  {e:"💎",a:"おしろへ！",m:"ひかるたからものをみつけた！"},
  {e:"👑",a:"おしろへ！",m:"おうかんがかがやいてる！ゴールはすぐそこ！"},
  {e:"🏰",a:"おしろへ！",m:"おしろにとうちゃく！やったー！！！"},
];

function load(){try{return JSON.parse(localStorage.getItem(SK)||"[]")}catch(e){return[]}}
function stats(){
  const r=load();
  return{
    correct:r.reduce((a,x)=>a+(x.correct||0),0),
    days:new Set(r.map(x=>x.date)).size,
    stars:r.reduce((a,x)=>a+(x.stars||0),0)
  }
}
function step(c){return Math.min(Math.floor(c/CPR),TOTAL)}

let _prev=-1;

function render(){
  const {correct,days,stars}=stats();
  const cleared=step(correct);
  const isGoal=cleared>=TOTAL;
  const inStep=correct%CPR;
  const rem=CPR-inStep;

  document.getElementById("sC").textContent=correct;
  document.getElementById("sD").textContent=days;
  document.getElementById("sS").textContent=stars;

  const pct=Math.min(Math.round(cleared/TOTAL*100),100);
  document.getElementById("progFill").style.width=pct+"%";
  document.getElementById("progPct").textContent=pct+"%";
  document.getElementById("progLabel").textContent=cleared===0?"スタート":cleared+"マスめ";

  if(isGoal){
    document.getElementById("goalBanner").classList.add("show");
    document.getElementById("nextCard").style.display="none";
    if(_prev<TOTAL)confetti(70);
  } else {
    document.getElementById("goalBanner").classList.remove("show");
    document.getElementById("nextCard").style.display="flex";
    document.getElementById("nextNum").textContent=rem;
    document.getElementById("nextBarFill").style.width=Math.round(inStep/CPR*100)+"%";
    document.getElementById("nextIcon").textContent=
      cleared<5?"🌲":cleared<10?"🌊":cleared<15?"🏜️":cleared<20?"⛰️":"🏰";
  }

  if(_prev>=0&&cleared>_prev&&!isGoal)confetti(28);
  _prev=cleared;

  drawSteps(cleared,isGoal);
  drawMascot(cleared,isGoal);
}

function drawSteps(cleared,isGoal){
  const g=document.getElementById("stepsGroup");
  g.innerHTML="";
  const ns="http://www.w3.org/2000/svg";

  POS.forEach((p,i)=>{
    const n=i+1;
    const done=cleared>=n;
    const cur=cleared+1===n&&!isGoal;
    const locked=!done&&!cur;
    const info=INFO[i];

    const sg=document.createElementNS(ns,"g");
    sg.style.cursor="pointer";
    sg.addEventListener("click",()=>popup(n,info,done,cur,locked,cleared,correct));

    const sh=document.createElementNS(ns,"circle");
    sh.setAttribute("cx",p.x+2);sh.setAttribute("cy",p.y+5);
    sh.setAttribute("r",cur?19:14);
    sh.setAttribute("fill","rgba(0,0,0,.35)");
    sg.appendChild(sh);

    if(cur){
      const ring=document.createElementNS(ns,"circle");
      ring.setAttribute("cx",p.x);ring.setAttribute("cy",p.y);ring.setAttribute("r",22);
      ring.setAttribute("fill","none");ring.setAttribute("stroke","#FF6B6B");ring.setAttribute("stroke-width","2.5");ring.setAttribute("opacity","0.5");
      const a1=document.createElementNS(ns,"animate");
      a1.setAttribute("attributeName","r");a1.setAttribute("values","20;28;20");
      a1.setAttribute("dur","1.6s");a1.setAttribute("repeatCount","indefinite");
      const a2=document.createElementNS(ns,"animate");
      a2.setAttribute("attributeName","opacity");a2.setAttribute("values","0.5;0;0.5");
      a2.setAttribute("dur","1.6s");a2.setAttribute("repeatCount","indefinite");
      ring.appendChild(a1);ring.appendChild(a2);
      sg.appendChild(ring);
    }

    const c=document.createElementNS(ns,"circle");
    c.setAttribute("cx",p.x);c.setAttribute("cy",p.y);
    c.setAttribute("r",cur?17:13);
    if(done){
      c.setAttribute("fill","#5ab840");
      c.setAttribute("stroke","white");c.setAttribute("stroke-width","2.5");
    } else if(cur){
      c.setAttribute("fill","#fff8e0");
      c.setAttribute("stroke","#FF6B6B");c.setAttribute("stroke-width","3.5");
    } else {
      c.setAttribute("fill","rgba(0,0,0,.4)");
      c.setAttribute("stroke","rgba(255,255,255,.3)");c.setAttribute("stroke-width","2");
      c.setAttribute("stroke-dasharray","4,3");
    }
    sg.appendChild(c);

    const t=document.createElementNS(ns,"text");
    t.setAttribute("x",p.x);t.setAttribute("y",p.y+6);
    t.setAttribute("text-anchor","middle");
    t.setAttribute("font-size",cur?"17":locked?"12":"13");
    t.textContent=locked?"🔒":info.e;
    sg.appendChild(t);

    if(done){
      const ck=document.createElementNS(ns,"text");
      ck.setAttribute("x",p.x+9);ck.setAttribute("y",p.y-8);
      ck.setAttribute("text-anchor","middle");ck.setAttribute("font-size","10");
      ck.textContent="✅";sg.appendChild(ck);
    }

    const num=document.createElementNS(ns,"text");
    num.setAttribute("x",p.x);num.setAttribute("y",p.y+26);
    num.setAttribute("text-anchor","middle");num.setAttribute("font-size","7.5");
    num.setAttribute("font-family","'Kosugi Maru',sans-serif");num.setAttribute("font-weight","bold");
    num.setAttribute("fill","rgba(255,255,255,.6)");
    num.textContent=n;
    sg.appendChild(num);

    g.appendChild(sg);
  });
}

function drawMascot(cleared,isGoal){
  const m=document.getElementById("mascot");
  if(cleared===0&&!isGoal){
    // スタート前：森の入口に待機
    m.style.display="";
    const p=POS[0];
    document.getElementById("mShadow").setAttribute("cx",p.x);
    document.getElementById("mShadow").setAttribute("cy",p.y+36);
    document.getElementById("mBody").setAttribute("transform","translate("+p.x+","+(p.y+20)+")");
    return;
  }
  if(isGoal){
    // ゴール：最後のマスで大喜び
    m.style.display="";
    const p=POS[TOTAL-1];
    document.getElementById("mShadow").setAttribute("cx",p.x);
    document.getElementById("mShadow").setAttribute("cy",p.y+36);
    document.getElementById("mBody").setAttribute("transform","translate("+p.x+","+(p.y+20)+")");
    document.getElementById("mMouth").setAttribute("d","M-10,16 Q0,28 10,16");
    return;
  }
  m.style.display="";
  const p=POS[cleared-1];
  document.getElementById("mShadow").setAttribute("cx",p.x);
  document.getElementById("mShadow").setAttribute("cy",p.y+36);
  document.getElementById("mBody").setAttribute("transform","translate("+p.x+","+(p.y+20)+")");
  document.getElementById("mMouth").setAttribute("d","M-8,18 Q0,25 8,18");
}

let correct=0;
function popup(n,info,done,cur,locked,cl,c){
  correct=c;
  document.getElementById("pEmoji").textContent=locked?"🔒":info.e;
  document.getElementById("pTitle").textContent="マス"+n+"："+info.a;
  document.getElementById("pSub").textContent=
    locked?("あと"+((n-cl-1)*CPR+(CPR-c%CPR))+"こせいかいするとひらくよ！🔑"):
    cur?"👈 いまここ！\n"+info.m:
    "✅ クリアずみ！\n"+info.m;
  document.getElementById("popup").classList.add("open");
}
function closePopup(){document.getElementById("popup").classList.remove("open")}
document.getElementById("popup").addEventListener("click",e=>{if(e.target===e.currentTarget)closePopup()});

function confetti(n){
  const w=document.getElementById("cf");
  w.style.display="block";
  const cols=["#FFD93D","#FF6B6B","#6BCB77","#4D96FF","#C77DFF","#FF9ECD"];
  for(let i=0;i<n;i++){
    const p=document.createElement("div");p.className="cp";
    const sz=6+Math.random()*10;
    p.style.cssText=`left:${Math.random()*100}%;top:-20px;width:${sz}px;height:${sz}px;background:${cols[Math.floor(Math.random()*cols.length)]};border-radius:${Math.random()>.5?"50%":"3px"};animation-duration:${1+Math.random()*1.6}s;animation-delay:${Math.random()*.8}s;`;
    w.appendChild(p);
  }
  setTimeout(()=>{w.style.display="none";w.innerHTML=""},3500);
}

render();
</script>
